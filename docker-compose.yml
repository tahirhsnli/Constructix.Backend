version: '3.8'

services:
  constructix_db:
    image: postgres:latest
    container_name: constructix_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - constructix_network
    restart: always

  pgadmin:
    image: dpage/pgadmin4
    container_name: constructix_pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - constructix_db
    networks:
      - constructix_network
    restart: always

networks:
  constructix_network:
    driver: bridge

volumes:
  postgres_data: