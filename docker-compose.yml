services:
  # 1. API
  constructix_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: constructix_api
    ports:
      - "5000:8080" # Brauzer localhost:5000 
    environment:
      - ConnectionStrings__DefaultConnection=Host=constructix_db;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      - constructix_db
    networks:
      - constructix_network
    restart: always

  # 2. Database
  constructix_db:
    image: postgres:latest
    container_name: constructix_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5435:5432"
    volumes:
      - constructix_db_new_volume:/var/lib/postgresql
    networks:
      - constructix_network
    restart: always

  # 3. Database (PGADMIN)
  pgadmin:
    image: dpage/pgadmin4
    container_name: constructix_pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - constructix_db
    networks:
      - constructix_network
    restart: always

networks:
  constructix_network:
    driver: bridge

volumes:
  constructix_db_new_volume: